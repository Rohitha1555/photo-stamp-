<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Timestamp</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Allura&family=Montserrat:wght@300&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .controls { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 16px auto; }
    input, button { padding: 12px; font-size: 16px; border-radius: 10px; border: none; width: 100%; box-sizing: border-box; }
    input[type="datetime-local"] { background: #242424; color: #fff; }
    button { background: #fff; color: #121212; font-weight: bold; cursor: pointer; }
    canvas { max-width: 100%; height: auto; margin-top: 16px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h2>Photo Timestamp</h2>
  <div class="controls">
    <input type="file" id="upload" accept="image/*" />
    <input type="datetime-local" id="datePicker" style="display:none;" />
    <button id="download" style="display:none;">Save Stamped Photo</button>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const datePicker = document.getElementById('datePicker');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('download');
    let loadedImg = null;

    function toLocalInputString(date) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    async function renderStamp() {
      if (!loadedImg) return;
      await document.fonts.ready;

      const date = new Date(datePicker.value);
      const dayText = date.toLocaleDateString('en-US', { weekday: 'long' });
      const timeText = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }).toLowerCase();

      canvas.width = loadedImg.width;
      canvas.height = loadedImg.height;
      ctx.drawImage(loadedImg, 0, 0);

      const daySize = Math.round(loadedImg.height * 0.068);
      const timeSize = Math.round(loadedImg.height * 0.032);
      const marginX = Math.round(loadedImg.width * 0.07);
      const marginY = Math.round(loadedImg.height * 0.06);

      ctx.textAlign = 'right';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      ctx.font = `${daySize}px "Allura", cursive`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.fillText(dayText, loadedImg.width - marginX, loadedImg.height - marginY - timeSize * 1.45);

      ctx.font = `300 ${timeSize}px "Montserrat", sans-serif`;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.fillText(timeText, loadedImg.width - marginX, loadedImg.height - marginY);
    }

    upload.addEventListener('change', (e) => {
      const file = e.target.files.item(0);
      if (!file) return;

      const photoDate = new Date(file.lastModified);
      datePicker.value = toLocalInputString(photoDate);
      datePicker.style.display = 'block';
      downloadBtn.style.display = 'block';

      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        renderStamp();
      };
      img.src = URL.createObjectURL(file);
    });

    datePicker.addEventListener('change', renderStamp);

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'stamped-photo.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
