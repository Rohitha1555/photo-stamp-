<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aesthetic Timestamp</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; margin: 0; }
    .controls { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 16px auto; }
    input, button { padding: 12px; font-size: 16px; border-radius: 10px; border: none; width: 100%; box-sizing: border-box; }
    input[type="datetime-local"] { background: #242424; color: #fff; }
    button { background: #fff; color: #121212; font-weight: bold; cursor: pointer; }
    canvas { max-width: 100%; height: auto; margin-top: 16px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <h2>Photo Timestamp</h2>
  <div class="controls">
    <input type="file" id="upload" accept="image/*" />
    <input type="datetime-local" id="datePicker" style="display:none;" />
    <button id="download" style="display:none;">Save Stamped Photo</button>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const datePicker = document.getElementById('datePicker');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('download');
    let loadedImg = null;

    function toLocalInputString(date) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    async function renderStamp() {
      if (!loadedImg) return;
      await document.fonts.ready;

      const date = new Date(datePicker.value);
      const dayText = date.toLocaleDateString('en-US', { weekday: 'long' });
      const timeText = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }).toLowerCase();

      canvas.width = loadedImg.width;
      canvas.height = loadedImg.height;
      ctx.drawImage(loadedImg, 0, 0);

      const scaleBase = Math.min(loadedImg.width, loadedImg.height);
      const daySize = Math.round(scaleBase * 0.115);
      const timeSize = Math.round(scaleBase * 0.056);
      const rightEdge = loadedImg.width - Math.round(loadedImg.width * 0.08);
      const bottomY = loadedImg.height - Math.round(loadedImg.height * 0.11);

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = Math.round(scaleBase * 0.015);
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 3;

      // 1. Draw Day of Week (e.g., Saturday)
      ctx.font = `700 ${daySize}px "Caveat", cursive`;
      ctx.textAlign = 'right';
      const dayWidth = ctx.measureText(dayText).width;
      const dayY = bottomY - timeSize * 1.15;

      ctx.save();
      ctx.translate(rightEdge, dayY);
      ctx.rotate(-0.03);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
      ctx.fillText(dayText, 0, 0);
      ctx.restore();

      // 2. Draw Golden-Orange Brush Swoosh
      const swooshStartX = rightEdge - dayWidth * 1.08;
      const swooshEndX = rightEdge + dayWidth * 0.08;
      const swooshY = dayY + Math.round(daySize * 0.14);

      const grad = ctx.createLinearGradient(swooshStartX, swooshY, swooshEndX, swooshY);
      grad.addColorStop(0, 'rgba(247, 178, 44, 0.25)');
      grad.addColorStop(0.25, 'rgba(247, 178, 44, 0.92)');
      grad.addColorStop(0.85, 'rgba(235, 130, 25, 0.95)');
      grad.addColorStop(1, 'rgba(235, 130, 25, 0.2)');

      ctx.beginPath();
      ctx.moveTo(swooshStartX, swooshY);
      ctx.quadraticCurveTo(
        (swooshStartX + swooshEndX) / 2,
        swooshY - daySize * 0.05,
        swooshEndX,
        swooshY + daySize * 0.06
      );
      ctx.quadraticCurveTo(
        (swooshStartX + swooshEndX) / 2,
        swooshY + daySize * 0.04,
        swooshStartX,
        swooshY + daySize * 0.03
      );
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // 3. Draw Handwritten Time (e.g., 02:30 pm)
      ctx.font = `600 ${timeSize}px "Caveat", cursive`;
      ctx.save();
      ctx.translate(rightEdge + Math.round(dayWidth * 0.02), bottomY);
      ctx.rotate(-0.02);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.94)';
      ctx.fillText(timeText, 0, 0);
      ctx.restore();

      ctx.restore();
    }

    upload.addEventListener('change', (e) => {
      const file = e.target.files.item(0);
      if (!file) return;

      const photoDate = new Date(file.lastModified);
      datePicker.value = toLocalInputString(photoDate);
      datePicker.style.display = 'block';
      downloadBtn.style.display = 'block';

      const img = new Image();
      img.onload = () => {
        loadedImg = img;
        renderStamp();
      };
      img.src = URL.createObjectURL(file);
    });

    datePicker.addEventListener('change', renderStamp);

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'stamped-photo.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.95);
      link.click();
    });
  </script>
</body>
</html>
